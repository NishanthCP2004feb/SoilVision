services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soilwise
      POSTGRES_USER: soilwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soilwise -d soilwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: {context: .., dockerfile: infra/backend.Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://soilwise:${POSTGRES_PASSWORD:-change_me}@postgres:5432/soilwise
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8000:8000"]
    volumes: [../storage:/app/storage, ../ml/artifacts:/app/ml/artifacts]
  frontend:
    build: {context: .., dockerfile: infra/frontend.Dockerfile}
    depends_on: [backend]
    ports: ["8080:80"]
volumes: {postgres_data: {}}
